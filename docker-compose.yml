services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./model/weights:/app/model/weights:ro
      - ./configs:/app/configs:ro
      - ./data:/app/data:ro
      - torch-cache:/root/.cache/torch
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

volumes:
  torch-cache:

