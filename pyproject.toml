[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "signalscope"
version = "1.0.0"
description = "Dual-Stream AI-Generated Media Authenticity & Provenance Detection Engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SIH Team"},
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "albumentations>=1.3.0",
    "Pillow>=10.0.0",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "grad-cam>=1.5.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "piexif>=1.1.3",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "isort>=5.12",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not network'"
markers = [
    "network: marks tests requiring external live streaming from Hugging Face datasets",
]
