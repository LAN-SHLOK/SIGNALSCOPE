training:
  epochs: 50
  batch_size: 32
  num_workers: 4

optimizer:
  type: "adamw"
  learning_rate: 1.0e-4
  weight_decay: 1.0e-2
  betas: [0.9, 0.999]

scheduler:
  type: "cosine_annealing"
  T_max: 50
  eta_min: 1.0e-6

early_stopping:
  patience: 10
  monitor: "val_auc"
  mode: "max"

seed: 42
