train:
  - type: "HorizontalFlip"
    p: 0.5
  - type: "VerticalFlip"
    p: 0.2
  - type: "RandomRotate90"
    p: 0.3
  - type: "ImageCompression"
    quality_lower: 40
    quality_upper: 95
    p: 0.5
  - type: "GaussianBlur"
    blur_limit: [3, 7]
    p: 0.3
  - type: "GaussNoise"
    var_limit: [10.0, 50.0]
    p: 0.3
  - type: "Resize"
    height: 224
    width: 224
    always_apply: true
  - type: "Normalize"
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
    always_apply: true

val:
  - type: "Resize"
    height: 224
    width: 224
    always_apply: true
  - type: "Normalize"
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
    always_apply: true
